x-bot: &bot
  build: .
  env_file:
    - .env
  volumes:
    - ./runtime:/app/runtime

services:
  trade:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "trade", "spy"]

  paper:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "trade", "spy"]

  monitor:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "monitor", "spy"]

  live-monitor:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "monitor", "spy"]

  paper-monitor:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "monitor", "spy"]

  # LCID long calls/puts on the existing trend signal — see
  # config/paper_options.env and docs/strategy_options_lcid_2026-08.md.
  # Paper only, explicitly a learning exercise (thin/concentrated backtest
  # evidence, not a validated edge) — run before ever considering
  # trade-options live. Requires options trading enabled on the Alpaca
  # paper account first (Alpaca's own dashboard — separate approval from
  # live).
  paper-options:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "trade", "options"]

  # NOT RECOMMENDED YET — see config/live_options.env. Present so the live
  # path is ready, not because it should be run today.
  trade-options:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "trade", "options"]

  paper-options-monitor:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "monitor", "options"]

  # Daily Markdown report (reports/daily_YYYY-MM-DD.md) built from the real
  # paper-options runtime database — run this once a day to track fills,
  # contract selection, and P&L.
  paper-options-daily:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "daily", "options"]

  # bot/options_research.py researches one SYMBOL per run (default LCID, set
  # by config/*_options.env).
  research-options-lcid:
    <<: *bot
    environment:
      - SYMBOL=LCID
    command: ["python", "-m", "bot.profile_runner", "live", "research", "options"]

  research:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "research", "spy"]

  optimize:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "optimize", "spy"]

  live-optimize:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "optimize", "spy"]

  validate:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    command: ["python", "-m", "bot.validate_runtime"]
