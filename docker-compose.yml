x-bot: &bot
  build: .
  env_file:
    - .env
  volumes:
    - ./runtime:/app/runtime

services:
  trade:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "trade", "spy"]

  paper:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "trade", "spy"]

  trade-btc:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "trade", "btc"]

  paper-btc:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "trade", "btc"]

  # Experimental same-day TSLA intraday variant - see config/live_tsladay.env
  # for why this isn't wired up as a default deploy target yet (only ~60
  # trading days of backtest evidence vs the primary "spy" profile's 2.9yr).
  # Run paper-tsladay for a real stretch before ever using trade-tsladay.
  trade-tsladay:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "trade", "tsladay"]

  paper-tsladay:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "trade", "tsladay"]

  monitor:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "monitor", "spy"]

  live-monitor:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "monitor", "spy"]

  paper-monitor:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "monitor", "spy"]

  btc-monitor:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "monitor", "btc"]

  paper-tsladay-monitor:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "monitor", "tsladay"]

  # NVDA/TSLA long calls/puts on the existing trend signal — see
  # config/paper_options.env and docs/strategy_options_2026-08.md. Paper
  # only for now: run this for a real stretch before ever considering
  # trade-options live, the same standard already applied to tsladay.
  # Requires options trading enabled on the Alpaca paper account first
  # (Alpaca's own dashboard — separate approval from live).
  paper-options:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "trade", "options"]

  # NOT RECOMMENDED YET — see config/live_options.env. Present so the live
  # path is ready, not because it should be run today.
  trade-options:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "trade", "options"]

  paper-options-monitor:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "paper", "monitor", "options"]

  # bot/options_research.py researches one SYMBOL per run (default NVDA, set
  # by config/*_options.env) — run both services to get a report for each
  # underlying.
  research-options-nvda:
    <<: *bot
    environment:
      - SYMBOL=NVDA
    command: ["python", "-m", "bot.profile_runner", "live", "research", "options"]

  research-options-tsla:
    <<: *bot
    environment:
      - SYMBOL=TSLA
    command: ["python", "-m", "bot.profile_runner", "live", "research", "options"]

  research:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "research", "spy"]

  research-btc:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "research", "btc"]

  optimize:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "optimize", "spy"]

  live-optimize:
    <<: *bot
    command: ["python", "-m", "bot.profile_runner", "live", "optimize", "spy"]

  validate:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    command: ["python", "-m", "bot.validate_runtime"]
